name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "yarn"

      # ---- Server ----
      - name: Install server dependencies
        run: |
          cd server
          yarn install

      - name: Run Prisma migrations
        run: |
          cd server
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      - name: Run server tests
        run: |
          cd server
          yarn test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb

      # ---- Client ----
      - name: Install client dependencies
        run: |
          cd client
          yarn install

      - name: Build client
        run: |
          cd client
          yarn build
